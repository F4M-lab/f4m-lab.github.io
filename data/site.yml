name: Future Feedstocks for Functional Materials
short_name: F4M
group_leader: Marco Beaumont
tagline: We turn underused biomass and waste streams into functional, high-performance materials.
intro: >-
  The F4M group develops selective, resource-efficient chemical and physical routes
  that turn overlooked biomass – aquatic plants and reed, straw and bagasse, insect
  farming residues – into functional materials. We work with cellulose, chitin, proteins
  and lignin, from green modification chemistry to nanofibrils, hydrogels, aerogels,
  bioplastics and 3D-printable composites, and we link molecular design to the
  properties of the final material.
